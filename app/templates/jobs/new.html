{% extends "base.html" %}

{% block title %}{{ heading|default("Add job") }}{% endblock %}

{% block content%}
<h1>{{ heading|default("Add job") }}</h1>
<form method="post">
    {{ csrf_field() }}
    <label for="customer_name">Customer name</label>
    <input name="customer_name" id="customer_name" value="{{ form['customer_name']}}" required autofocus>

    <label for="phone">Phone</label>
    <input name="phone" id="phone" value="{{ form['phone']}}" required>

    <label for="make">Make</label>
    <input name="make" id="make" list="make-list" value="{{ form['make']}}" required autocomplete="off">
    <datalist id="make-list">
        {% for make in car_models %}<option value="{{ make }}">{% endfor %}
    </datalist>

    <label for="model">Model</label>
    <input name="model" id="model" list="model-list" value="{{ form['model']}}" required autocomplete="off">
    <datalist id="model-list"></datalist>

    <label for="year">Year</label>
    <input type="number" name="year" id="year" value="{{ form['year']}}" required>

    <label for="plate">Plate</label>
    <input name="plate" id="plate" value="{{ form['plate']}}" required>

    <label for="vin">VIN (optional)</label>
    <input name="vin" id="vin" value="{{ form['vin']}}">

    <label for="mileage">Mileage(km)</label>
    <input type="number" name="mileage" id="mileage" value="{{ form['mileage']}}" required>

    <label for="engine">Engine</label>
    <input name="engine" id="engine" value="{{ form['engine'] }}">

    <label for="fuel_type">Fuel type</label>
    <select name="fuel_type" id="fuel_type" required>
        {% for fuel in fuel_types %}
        <option value="{{ fuel }}" {% if form['fuel_type'] == fuel %}selected{% endif %}>{{ fuel }}</option>
        {% endfor %}
    </select>

    <label for="date_received">Date received</label>
    <input type="date" name="date_received" id="date_received" value="{{ form['date_received']}}" required>

    <label for="problem">Problem described by the customer</label>
    <textarea name="problem" id="problem" rows="4" required>{{ form['problem'] }}</textarea>

    <button type="submit">{{ button|default("Save job") }}</button>
</form>

<script>
    const carModels = {{ car_models|tojson }};
    const makeInput = document.getElementById("make");
    const modelList = document.getElementById("model-list")

    const plain = (text) =>
        text.normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();

    function fillModels() {
        modelList.innerHTML = "";
        for (const make in carModels) {
            if (plain(make) === plain(makeInput.value)) {
                for (const model of carModels[make]) {
                    const option = document.createElement("option");
                    option.value = model;
                    modelList.appendChild(option);
                }
            }
        }
    }

    makeInput.addEventListener("input", fillModels);
    fillModels();
</script>
{% endblock %}
