<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %} - WrenchTrack</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
</head>
<body>
    <nav class="topbar">
        <a class="brand" href="{{ url_for('home') }}">WrenchTrack</a>
        {% if g.user %}
            <a href="{{ url_for('jobs.dashboard') }}"
                {% if request.endpoint == 'jobs.dashboard' %}aria-current="page"{% endif %}>Dashboard</a>
            <a href="{{ url_for('jobs.index') }}"
                {% if request.endpoint == 'jobs.index' %}aria-current="page"{% endif %}>Jobs</a>
            <a href="{{ url_for('jobs.new') }}"
                {% if request.endpoint == 'jobs.new' %}aria-current="page"{% endif %}>New job</a>
            <span class="who">
                {{ g.user["username"] }}
                <form class="inline-form" method="post" action="{{ url_for('auth.logout') }}">
                    {{ csrf_field() }}
                    <button type="submit">Log out</button>
                </form>
            </span>
        {% endif %}
    </nav>
    <main class="{% block main_class %}{% endblock %}">
        {% for category, message in get_flashed_messages(with_categories=true) %}
            <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
